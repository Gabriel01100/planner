services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////app/data/calenflex.db
      CALENFLEX_ENV: production
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - calenflex-data:/app/data
    restart: unless-stopped
volumes:
  calenflex-data:
